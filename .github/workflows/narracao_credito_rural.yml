name: Gerar narracao brasileira - Credito Rural
on:
  push:
    branches:
      - narracao-credito-rural-2026
    paths:
      - .github/workflows/narracao_credito_rural.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar sintetizador gratuito
        run: python -m pip install edge-tts
      - name: Sintetizar voz masculina PT-BR com pausas naturais
        run: |
          cat > /tmp/locucao.py <<'PY'
          import asyncio, subprocess, pathlib
          import edge_tts

          voz = "pt-BR-FabioNeural"
          partes = [
              ("O banco negou a prorrogação da sua dívida rural depois de uma safra ruim?", 0.45),
              ("Essa resposta pode não ser a última palavra.", 0.30),
              ("Renegociação comum e prorrogação de crédito rural são coisas diferentes.", 0.30),
              ("Quando há dificuldade comprovada de pagamento, por frustração de safra ou problema de comercialização, a prorrogação pode ser um direito do produtor, não um favor do banco.", 0.32),
              ("É o que diz a Súmula duzentos e noventa e oito do Superior Tribunal de Justiça: o alongamento da dívida rural não é faculdade da instituição financeira, e sim direito do devedor, nos termos da lei.", 0.34),
              ("Mas não é automático.", 0.28),
              ("Tipo de contrato, origem dos recursos, documentação e prazos fazem toda a diferença.", 0.25),
              ("Antes de assinar qualquer renegociação, entenda quais regras realmente se aplicam à sua dívida.", 0.42),
              ("Vinícius Machado, advogado. Informações profissionais no perfil.", 0.0),
          ]
          pasta = pathlib.Path("trechos")
          pasta.mkdir(exist_ok=True)
          concat = []
          async def main():
              for i,(texto,pausa) in enumerate(partes):
                  trecho = pasta / f"fala_{i:02d}.mp3"
                  await edge_tts.Communicate(texto, voice=voz, rate="-2%", pitch="-4Hz").save(str(trecho))
                  concat.append(trecho)
                  if pausa:
                      silence = pasta / f"pausa_{i:02d}.mp3"
                      subprocess.run(["ffmpeg","-nostdin","-y","-f","lavfi","-i",f"anullsrc=r=44100:cl=mono","-t",str(pausa),"-c:a","libmp3lame","-q:a","3",str(silence)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      concat.append(silence)
          asyncio.run(main())
          lista = pathlib.Path("trechos/lista.txt")
          lista.write_text("".join(f"file '{p.name}'\n" for p in concat),encoding="utf-8")
          subprocess.run(["ffmpeg","-nostdin","-y","-f","concat","-safe","0","-i",str(lista),"-af","loudnorm=I=-17:TP=-1.5:LRA=11","-ar","44100","-c:a","libmp3lame","-b:a","192k","Narracao_Credito_Rural_Sumula_298.mp3"],check=True)
          PY
          python /tmp/locucao.py
      - name: Disponibilizar MP3
        uses: actions/upload-artifact@v4
        with:
          name: Narracao_Credito_Rural_Sumula_298
          path: Narracao_Credito_Rural_Sumula_298.mp3
      - name: Salvar MP3 neste ramo sem alterar o site principal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Narracao_Credito_Rural_Sumula_298.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Gerar narracao de credito rural em MP3"
          git push
